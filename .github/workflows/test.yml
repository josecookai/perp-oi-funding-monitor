name: test

on:
  push:
    branches: [main]
    paths-ignore: ["reports/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src --ignore-missing-imports
      # Live tests are skipped here: GitHub's runners are mostly in the US and
      # Binance answers US IPs with HTTP 451.
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80
