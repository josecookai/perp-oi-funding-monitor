[project]
name = "perp-oi-funding-monitor"
version = "0.1.0"
description = "Scanner for open interest and funding on US stock perps (Binance USDT-M + Hyperliquid HIP-3)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
perp-monitor = "perp_monitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: hits real Binance/Hyperliquid APIs (set RUN_LIVE=1 to run)"]

[tool.coverage.run]
source = ["perp_monitor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["−", "×"]

[tool.ruff.lint.per-file-ignores]
# Chinese UI text uses full-width punctuation on purpose.
"src/perp_monitor/insights/narrative.py" = ["RUF001"]
"src/perp_monitor/insights/sec_filings.py" = ["RUF001"]
"tests/unit/test_insights_*.py" = ["RUF001"]
